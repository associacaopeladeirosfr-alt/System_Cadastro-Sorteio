<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caixa Peladeiros 2027</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --accent: #10b981;
            --text: #f8fafc;
            --border: #334155;
            --secondary: #94a3b8;
            --danger: #ef4444;
            --gold: #fbbf24;
            --blue: #3b82f6;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 15px;
        }

        .container {
            max-width: 600px;
            margin: auto;
        }

        .header-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .btn-home {
            text-decoration: none;
            color: #94a3b8;
            background: #0f172a;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .player-row {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-goleiro {
            background: #0f172a;
            border: 1px solid var(--border);
            color: var(--secondary);
            padding: 8px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-goleiro.ativo {
            color: var(--gold);
            border-color: var(--gold);
            background: rgba(251, 191, 36, 0.1);
        }

        .name-box {
            display: flex;
            flex-direction: column;
        }

        .name-text {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .tag {
            font-size: 0.6rem;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .tag-mensalista {
            background: var(--blue);
            color: white;
        }

        .tag-avulso {
            background: #64748b;
            color: white;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .status-badge {
            font-size: 0.75rem;
            font-weight: bold;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 6px;
            text-align: center;
            min-width: 80px;
            transition: 0.2s;
        }

        .pendente {
            background: var(--gold);
            color: #000;
        }

        .pago-ok {
            background: rgba(16, 185, 129, 0.1);
            color: var(--accent);
            border: 1px solid var(--accent);
        }

        .status-badge.bloqueado {
            background: #334155 !important;
            color: #94a3b8 !important;
            cursor: not-allowed;
            opacity: 0.5;
            border: none;
        }

        .check-presenca {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            border: 2px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .check-presenca.active {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
        }

        .check-presenca.disabled {
            opacity: 0.2;
            cursor: not-allowed;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(4px);
        }

        .modal-content {
            background: var(--card);
            margin: 15% auto;
            padding: 20px;
            border-radius: 15px;
            width: 90%;
            max-width: 400px;
            border: 1px solid var(--border);
            text-align: center;
        }

        .input-group {
            display: flex;
            align-items: center;
            background: #0f172a;
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: 10px;
            padding: 0 10px;
        }

        .input-group input {
            background: transparent;
            border: none;
            color: white;
            padding: 12px;
            width: 100%;
            outline: none;
        }

        .btn-modal {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .badge {
            background: #334155;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            color: #cbd5e1;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="header-box">
            <div>
                <h2 style="margin:0;">🙋‍♂️ Peladeiros Presença</h2>
                <span class="badge">Gestão Peladeiros 2027</span>
            </div>
            <a href="index.html" class="btn-home"><i class="fas fa-home"></i> Menu Principal</a>
        </div>
        <div id="listaJogadores">Carregando dados...</div>
    </div>

    <!-- Modal Financeiro -->
    <div id="modalFinanceiro" class="modal">
        <div class="modal-content">
            <h3 id="mNome" style="margin-top:0"></h3>
            <p id="mInfoValor" style="font-size: 0.85rem; color: var(--secondary); margin-bottom: 15px;"></p>
            <div class="input-group"><i class="fa-brands fa-pix"></i><input type="number" id="fPix" placeholder="Pix">
            </div>
            <div class="input-group"><i class="fas fa-money-bill-wave"></i><input type="number" id="fDin"
                    placeholder="Dinheiro"></div>
            <div class="input-group"><i class="fas fa-credit-card"></i><input type="number" id="fCrd"
                    placeholder="Crédito"></div>
            <button class="btn-modal" style="background: var(--accent); color: white;" onclick="confirmarCaixa()">SALVAR
                PAGAMENTO</button>
            <button class="btn-modal" style="background: var(--danger); color: white;" onclick="zerarCaixa()">ZERAR
                VALORES</button>
            <button class="btn-modal" style="background: var(--secondary); color: white;"
                onclick="fecharModal()">CANCELAR</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBji-wGGD2dl8STFS2tu23UKFaUrPC8Bww",
            authDomain: "db-peladeiros.firebaseapp.com",
            projectId: "db-peladeiros",
            storageBucket: "db-peladeiros.firebasestorage.app",
            messagingSenderId: "734317810376",
            appId: "1:734317810376:web:24573f2b49fdd232134bfd",
            measurementId: "G-8N28SLY3S6"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        auth.onAuthStateChanged(async (user) => {
            if (!user) { window.location.href = "login.html"; }
            else {
                const emailGoogle = user.email.toLowerCase().trim();
                const query = await db.collection("usuarios_permitidos").where("email", "==", emailGoogle).get();
                if (query.empty) { await auth.signOut(); window.location.href = "login.html"; }
            }
        });

        let CONFIG = { valorMensal: 60, valorAvulso: 15, diaLimite: 10 };
        let selId = "";
        let selCampo = "";

        async function init() {
            try {
                const doc = await db.collection("configuracoes").doc("parametros").get();
                if (doc.exists) CONFIG = doc.data();
                carregarDados();
            } catch (e) { carregarDados(); }
        }

        function carregarDados() {
            db.collection("jogadores_2026_beta").orderBy("nome", "asc").onSnapshot(snap => {
                const lista = document.getElementById('listaJogadores');
                lista.innerHTML = "";
                const diaHoje = new Date().getDate();

                snap.forEach(doc => {
                    const j = doc.data();
                    const id = doc.id;

                    const isMensalista = String(j.tipo).toLowerCase() === 'mensalista';
                    const isGoleiro = j.goleiro === true;
                    const vMensal = parseFloat(j.valorMensalidadePago || 0);
                    const vHoje = parseFloat(j.valorPagoHoje || 0);

                    // 1. Verificação de status de pagamento
                    const pagouMensal = vMensal >= CONFIG.valorMensal;
                    const pagouHoje = vHoje >= CONFIG.valorAvulso;
                    const prazoAtrasado = isMensalista && !pagouMensal && (diaHoje > CONFIG.diaLimite);

                    // O jogador está "Liberado" se for goleiro OU pagou mensal OU pagou hoje
                    const estaPago = isGoleiro || pagouMensal || pagouHoje;

                    // 2. Lógica de liberação para pagamento avulso pós-prazo
                    let statusLabel = "CAIXA";
                    let statusClass = "pendente";
                    let campoDestino = isMensalista ? "valorMensalidadePago" : "valorPagoHoje";
                    let bloqueado = false;

                    if (isGoleiro) {
                        statusLabel = "PAGO";
                        statusClass = "pago-ok";
                        bloqueado = true;
                    } else if (pagouMensal) {
                        statusLabel = "PAGO (M)";
                        statusClass = "pago-ok";
                        bloqueado = true;
                    } else if (pagouHoje) {
                        statusLabel = "PAGO (A)";
                        statusClass = "pago-ok";
                        bloqueado = false; // Permite zerar ou editar se necessário
                    } else if (prazoAtrasado) {
                        statusLabel = "AVULSO (ATRASO)";
                        statusClass = "pendente";
                        campoDestino = "valorPagoHoje"; // OBRIGA a pagar o avulso
                    }

                    const apto = (j.presencaConfirmada === "S" || j.presencaConfirmada === "true" || j.presencaConfirmada === true);

                    lista.innerHTML += `
            <div class="player-row" style="${isGoleiro ? 'border-color: var(--gold)' : ''}">
                <div class="player-info">
                    <div class="btn-goleiro ${isGoleiro ? 'ativo' : ''}" onclick="window.toggleGoleiro('${id}', ${isGoleiro})">
                        <i class="fas fa-hands"></i>
                    </div>
                    <div class="name-box">
                        <span class="name-text">${j.nome}</span>
                        <span class="tag ${isMensalista ? 'tag-mensalista' : 'tag-avulso'}">${j.tipo}</span>
                    </div>
                </div>
                <div class="controls">
                    <div class="status-badge ${statusClass} ${bloqueado ? 'bloqueado' : ''}" 
                         onclick="${bloqueado ? `console.log('Isento ou Pago')` : `window.abrirFinanceiro('${id}', '${j.nome}', '${campoDestino}')`}">
                         ${statusLabel}
                    </div>

                    <div class="check-presenca ${apto ? 'active' : ''} ${!estaPago ? 'disabled' : ''}" 
                         onclick="window.togglePresenca('${id}', '${j.presencaConfirmada}', ${estaPago}, ${isGoleiro})">
                         <i class="fas fa-check"></i>
                    </div>
                </div>
            </div>`;
                });
            });
        }

        window.toggleGoleiro = async (id, statusAtual) => {
            await db.collection("jogadores_2026_beta").doc(id).update({
                goleiro: !statusAtual,
                presencaConfirmada: !statusAtual ? "S" : "N",
                dataConfirmacao: new Date().toISOString()
            });
        };

        window.togglePresenca = async (id, statusAtual, estaPago, isGoleiro) => {
            if (!estaPago && !isGoleiro) {
                alert("Pagamento pendente! O jogador precisa pagar a mensalidade ou o valor avulso (se o prazo expirou).");
                return;
            }
            const novoStatus = (statusAtual === "S" || statusAtual === "true") ? "N" : "S";
            await db.collection("jogadores_2026_beta").doc(id).update({
                presencaConfirmada: novoStatus,
                dataConfirmacao: new Date().toISOString()
            });
        };

        window.abrirFinanceiro = (id, nome, campo) => {
            selId = id; selCampo = campo;
            const valorEsperado = campo === 'valorMensalidadePago' ? CONFIG.valorMensal : CONFIG.valorAvulso;

            document.getElementById('mNome').innerText = nome;
            document.getElementById('mInfoValor').innerText = `Valor a pagar: R$ ${valorEsperado.toFixed(2)}`;
            document.getElementById('fPix').value = "";
            document.getElementById('fDin').value = "";
            document.getElementById('fCrd').value = "";
            document.getElementById('modalFinanceiro').style.display = "block";
        };


        window.confirmarCaixa = async () => {
            const pix = parseFloat(document.getElementById('fPix').value) || 0;
            const din = parseFloat(document.getElementById('fDin').value) || 0;
            const crd = parseFloat(document.getElementById('fCrd').value) || 0;
            const total = pix + din + crd;
            const limite = selCampo === 'valorMensalidadePago' ? CONFIG.valorMensal : CONFIG.valorAvulso;

            if (Math.abs(total - limite) > 0.01) {
                alert(`Valor incorreto! O sistema espera R$ ${limite.toFixed(2)} para liberar este jogador.`);
                return;
            }

            let formaEscolhida = "";
            if (pix > 0) formaEscolhida = "Pix";
            else if (din > 0) formaEscolhida = "Dinheiro";
            else if (crd > 0) formaEscolhida = "Cartão";

            // Prepara o objeto de atualização
            const dadosUpdate = {
                [selCampo]: total,
                formaPagamento: formaEscolhida,
                presencaConfirmada: "S",
                dataConfirmacao: new Date().toISOString()
            };

            try {
                await db.collection("jogadores_2026_beta").doc(selId).update(dadosUpdate);
                window.fecharModal();
            } catch (error) {
                console.error("Erro ao salvar:", error);
                alert("Erro ao salvar pagamento.");
            }
        };

        window.zerarCaixa = async () => {
            if (confirm("Deseja zerar os valores deste jogador? A presença será removida.")) {
                await db.collection("jogadores_2026_beta").doc(selId).update({
                    valorMensalidadePago: 0,
                    valorPagoHoje: 0,
                    formaPagamento: "",
                    presencaConfirmada: "N"
                });
                window.fecharModal();
            }
        };
        window.fecharModal = () => document.getElementById('modalFinanceiro').style.display = "none";

        init();
    </script>
</body>

</html>
