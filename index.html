<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Peladeiros</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-gradient: radial-gradient(circle at top, #1e293b 0%, #0f172a 100%);
            --card: rgba(30, 41, 59, 0.7);
            --accent: #10b981;
            --accent-glow: rgba(16, 185, 129, 0.2);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #ef4444;
            --border: #334155;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-card {
            background: var(--card);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 45px 35px;
            border-radius: 24px;
            border: 1px solid var(--border);
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .logo-container {
            margin-bottom: 25px;
            position: relative;
            display: inline-block;
        }

        .logo-img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid var(--accent);
            box-shadow: 0 0 20px var(--accent-glow);
            transition: transform 0.3s ease;
        }

        .login-card:hover .logo-img {
            transform: scale(1.04);
        }

        h2 {
            margin: 0 0 8px 0;
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .badge-ano {
            background: rgba(16, 185, 129, 0.15);
            color: var(--accent);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 20px;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin: 0 0 30px 0;
            line-height: 1.6;
        }

        .btn-google {
            width: 100%;
            padding: 16px;
            background: #0f172a;
            color: var(--text-main);
            border: 1px solid var(--border);
            border-radius: 14px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: all 0.25s ease;
        }

        .btn-google:hover {
            background: #1e293b;
            border-color: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .btn-google i {
            font-size: 1.2rem;
            color: #ea4335;
        }

        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--danger);
            color: #fca5a5;
            padding: 14px;
            border-radius: 12px;
            margin-top: 20px;
            font-size: 0.85rem;
            display: none;
            line-height: 1.5;
            animation: fadeIn 0.3s ease forwards;
        }

        .loading {
            display: none;
            color: var(--accent);
            margin-top: 20px;
            font-size: 0.95rem;
            font-weight: 500;
        }

        .loading i {
            margin-right: 8px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <div class="login-card">
        <div class="logo-container">
            <img src="logo.jpg" alt="Peladeiros F.R." class="logo-img" onerror="this.style.display='none';">
            <h2>Futebol e Resenha</h2>
            <span class="badge-ano">Gestão Peladeiros 2027</span>
        </div>


        <p>Área restrita à Administradores e Conselheiros. Efetue login com sua conta Google autorizada.</p>

        <button class="btn-google" id="btnLogin" onclick="loginComGoogle()">
            <i class="fab fa-google"></i> Entrar com o Google
        </button>

        <div class="loading" id="loadingArea">
            <i class="fas fa-spinner fa-spin"></i> Validando credenciais de acesso...
        </div>

        <div class="error-message" id="msgErro">
            <i class="fas fa-exclamation-triangle" style="margin-right: 5px;"></i> <strong>Acesso
                Negado!</strong><br>
            Este e-mail não possui autorização no sistema dos Peladeiros. Solicite a liberação ao Conselheiro.
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBji-wGGD2dl8STFS2tu23UKFaUrPC8Bww",
            authDomain: "db-peladeiros.firebaseapp.com",
            projectId: "db-peladeiros",
            storageBucket: "db-peladeiros.firebasestorage.app",
            messagingSenderId: "734317810376",
            appId: "1:734317810376:web:24573f2b49fdd232134bfd",
            measurementId: "G-8N28SLY3S6"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        auth.onAuthStateChanged(async (user) => {
            if (user) {
                const emailGoogle = user.email.toLowerCase().trim();
                const query = await db.collection("usuarios_permitidos").where("email", "==", emailGoogle).get();
                if (!query.empty) {
                    window.location.href = "home.html";
                }
            }
        });

        async function loginComGoogle() {
            const provider = new firebase.auth.GoogleAuthProvider();
            const btnLogin = document.getElementById('btnLogin');
            const loadingArea = document.getElementById('loadingArea');
            const msgErro = document.getElementById('msgErro');

            msgErro.style.display = "none";
            btnLogin.style.display = "none";
            loadingArea.style.display = "block";

            try {
                const resultado = await auth.signInWithPopup(provider);
                const usuario = resultado.user;
                const emailGoogle = usuario.email.toLowerCase().trim();

                const query = await db.collection("usuarios_permitidos")
                    .where("email", "==", emailGoogle)
                    .get();

                if (!query.empty) {
                    window.location.href = "home.html";
                } else {
                    await auth.signOut();
                    msgErro.style.display = "block";
                    btnLogin.style.display = "flex";
                    loadingArea.style.display = "none";
                }

            } catch (error) {
                console.error(error);
                alert("Erro ao efetuar o login ou janela fechada.");
                btnLogin.style.display = "flex";
                loadingArea.style.display = "none";
            }
        }
    </script>
</body>

</html>
