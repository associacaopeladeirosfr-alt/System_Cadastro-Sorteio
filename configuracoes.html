<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurações Peladeiros 2027</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --accent: #10b981;
            --text: #f8fafc;
            --border: #334155;
            --secondary: #94a3b8;
            --danger: #ef4444;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            width: 100%;
        }

        .header-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            width: 100%;
            gap: 10px;
        }

        .title-group {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 4px;
        }

        .btn-home {
            text-decoration: none;
            color: #94a3b8;
            background: #1e293b;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            border: 1px solid #334155;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
            white-space: nowrap;
        }

        .btn-home:hover {
            background: #334155;
            color: white;
        }

        .badge {
            background: #334155;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.7rem;
            color: #cbd5e1;
            display: inline-block;
        }

        .config-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: var(--secondary);
            font-size: 0.85rem;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            background: #0f172a;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 5px 15px;
            width: 100%;
        }

        .input-wrapper i {
            color: var(--accent);
            width: 25px;
        }

        .input-wrapper input {
            background: transparent;
            border: none;
            color: white;
            padding: 12px;
            width: 100%;
            font-size: 1.1rem;
            outline: none;
        }

        .input-wrapper:focus-within {
            border-color: var(--accent);
        }

        .btn-save {
            width: 100%;
            background: var(--accent);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .btn-save:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .info-msg {
            background: rgba(16, 185, 129, 0.1);
            color: var(--accent);
            padding: 10px;
            border-radius: 8px;
            font-size: 0.8rem;
            text-align: center;
            margin-top: 20px;
            display: none;
        }

        /* ESTILOS DA LISTA DE EMAILS */
        .tabela-container {
            width: 100%;
            overflow-x: auto;
            margin-top: 15px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #0f172a;
        }

        th,
        td {
            padding: 10px 12px;
            text-align: left;
            font-size: 0.9rem;
        }

        th {
            background: #1e293b;
            color: var(--secondary);
            font-size: 0.75rem;
            text-transform: uppercase;
        }

        td {
            border-bottom: 1px solid var(--border);
            color: white;
        }

        .btn-remove-email {
            background: none;
            border: none;
            color: var(--danger);
            cursor: pointer;
            font-size: 1rem;
            padding: 4px 8px;
        }

        .btn-remove-email:hover {
            opacity: 0.8;
        }

        @media (max-width: 400px) {
            .header-box {
                flex-direction: column;
                align-items: flex-start;
            }

            .btn-home {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="header-box">
            <div class="title-group">
                <h2 style="margin:0;">⚙️ Peladeiros Configurações</h2>
                <span class="badge">Gestão Peladeiros 2027</span>
            </div>
            <a href="index.html" class="btn-home">
                <i class="fas fa-home"></i> Menu Principal
            </a>
        </div>

        <div class="config-card">
            <div class="form-group">
                <label>Valor Mensalidade (R$)</label>
                <div class="input-wrapper">
                    <i class="fas fa-calendar-check"></i>
                    <input type="number" id="confMensal" placeholder="Ex: 60.00">
                </div>
            </div>

            <div class="form-group">
                <label>Valor Avulso (R$)</label>
                <div class="input-wrapper">
                    <i class="fas fa-user-clock"></i>
                    <input type="number" id="confAvulso" placeholder="Ex: 15.00">
                </div>
            </div>

            <div class="form-group">
                <label>Dia Limite de Pagamento</label>
                <div class="input-wrapper">
                    <i class="fas fa-bell"></i>
                    <input type="number" id="confDiaLimite" placeholder="Ex: 10" min="1" max="31">
                </div>
                <small style="color: var(--secondary); font-size: 0.7rem;">Dia do mês para considerar como
                    pendente.</small>
            </div>

            <button class="btn-save" onclick="salvarConfiguracoes()">
                <i class="fas fa-save"></i> SALVAR CONFIGURAÇÕES
            </button>

            <div id="msgSucesso" class="info-msg">
                <i class="fas fa-check-circle"></i> Configurações atualizadas com sucesso!
            </div>
        </div>

        <div class="config-card">
            <h3 style="margin-top: 0; margin-bottom: 15px; font-size: 1.1rem; color: white;"><i class="fas fa-users-cog"
                    style="color: var(--accent); margin-right: 8px;"></i> E-mails Autorizados</h3>

            <div class="form-group">
                <label>Adicionar E-mail para Login</label>
                <div class="input-wrapper">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="novoEmailPermitido" placeholder="jogador@gmail.com">
                </div>
            </div>

            <button class="btn-save" style="background: #3b82f6;" onclick="autorizarEmail()">
                <i class="fas fa-user-plus"></i> AUTORIZAR ACESSO
            </button>

            <div id="msgSucessoEmail" class="info-msg" style="background: rgba(59, 130, 246, 0.1); color: #60a5fa;">
                <i class="fas fa-check-circle"></i> E-mail autorizado com sucesso!
            </div>

            <div class="tabela-container">
                <table>
                    <thead>
                        <tr>
                            <th>E-mail</th>
                            <th style="width: 50px; text-align: center;">Ação</th>
                        </tr>
                    </thead>
                    <tbody id="listaEmailsCorpo">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBji-wGGD2dl8STFS2tu23UKFaUrPC8Bww",
            authDomain: "db-peladeiros.firebaseapp.com",
            projectId: "db-peladeiros",
            storageBucket: "db-peladeiros.firebasestorage.app",
            messagingSenderId: "734317810376",
            appId: "1:734317810376:web:24573f2b49fdd232134bfd",
            measurementId: "G-8N28SLY3S6"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        // TRAVA DE SEGURANÇA: Se não estiver logado e autorizado, chuta para a login.html
        auth.onAuthStateChanged(async (user) => {
            if (!user) {
                window.location.href = "login.html";
            } else {
                const emailGoogle = user.email.toLowerCase().trim();
                const query = await db.collection("usuarios_permitidos").where("email", "==", emailGoogle).get();
                if (query.empty) {
                    await auth.signOut();
                    window.location.href = "login.html";
                }
            }
        });

        // Carregar configurações financeiras atuais ao abrir a tela
        async function carregarConfig() {
            try {
                const doc = await db.collection("configuracoes").doc("parametros").get();
                if (doc.exists) {
                    const data = doc.data();
                    document.getElementById('confMensal').value = data.valorMensal || "";
                    document.getElementById('confAvulso').value = data.valorAvulso || "";
                    document.getElementById('confDiaLimite').value = data.diaLimite || "";
                }
            } catch (error) {
                console.error("Erro ao carregar configurações:", error);
            }
        }

        // Salvar Parâmetros Financeiros no Firebase
        async function salvarConfiguracoes() {
            const valorM = parseFloat(document.getElementById('confMensal').value);
            const valorA = parseFloat(document.getElementById('confAvulso').value);
            const diaL = parseInt(document.getElementById('confDiaLimite').value);

            if (isNaN(valorM) || isNaN(valorA) || isNaN(diaL)) {
                alert("Preencha todos os campos corretamente.");
                return;
            }

            try {
                await db.collection("configuracoes").doc("parametros").set({
                    valorMensal: valorM,
                    valorAvulso: valorA,
                    diaLimite: diaL,
                    ultimaAtualizacao: new Date().toISOString()
                });

                const msg = document.getElementById('msgSucesso');
                msg.style.display = 'block';
                setTimeout(() => { msg.style.display = 'none'; }, 3000);

            } catch (error) {
                alert("Erro ao salvar configurações.");
            }
        }

        // LÓGICA 1: Adicionar/Autorizar um novo e-mail no Firestore
        async function autorizarEmail() {
            const emailInput = document.getElementById('novoEmailPermitido').value.trim().toLowerCase();

            if (!emailInput || !emailInput.includes("@")) {
                alert("Por favor, digite um endereço de e-mail válido.");
                return;
            }

            try {
                // Evita duplicar o e-mail se ele já estiver cadastrado
                const busca = await db.collection("usuarios_permitidos").where("email", "==", emailInput).get();
                if (!busca.empty) {
                    alert("⚠️ Este e-mail já está na lista de autorizados!");
                    return;
                }

                // Salva na coleção lida pela tela de login
                await db.collection("usuarios_permitidos").add({
                    email: emailInput,
                    dataAutorizacao: firebase.firestore.FieldValue.serverTimestamp()
                });

                document.getElementById('novoEmailPermitido').value = "";

                const msg = document.getElementById('msgSucessoEmail');
                msg.style.display = 'block';
                setTimeout(() => { msg.style.display = 'none'; }, 3000);

            } catch (error) {
                console.error(error);
                alert("Erro ao salvar permissão de e-mail.");
            }
        }

        // LÓGICA 2: Listar em tempo real os e-mails que possuem autorização
        function carregarListaEmails() {
            db.collection("usuarios_permitidos").orderBy("email", "asc").onSnapshot(snap => {
                const tbody = document.getElementById('listaEmailsCorpo');
                if (!tbody) return;
                tbody.innerHTML = "";

                snap.forEach(doc => {
                    const dados = doc.data();
                    const id = doc.id;

                    tbody.innerHTML += `
                        <tr>
                            <td>${dados.email}</td>
                            <td style="text-align: center;">
                                <button class="btn-remove-email" onclick="revogarEmail('${id}', '${dados.email}')" title="Revogar acesso">
                                    <i class="fas fa-user-times"></i>
                                </button>
                            </td>
                        </tr>
                    `;
                });
            });
        }

        // LÓGICA 3: Remover/Revogar o acesso de um e-mail
        async function revogarEmail(id, email) {
            if (confirm(`Tem certeza que deseja revogar o acesso do e-mail: ${email}?`)) {
                try {
                    await db.collection("usuarios_permitidos").doc(id).delete();
                } catch (error) {
                    alert("Erro ao remover permissão.");
                }
            }
        }

        // Inicializador geral ao carregar a página
        window.onload = function () {
            carregarConfig();
            carregarListaEmails();
        };
    </script>
</body>

</html>
