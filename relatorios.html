<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relatórios Peladeiros 2027</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --accent: #10b981;
            --text: #f8fafc;
            --border: #334155;
            --secondary: #94a3b8;
            --blue: #3b82f6;
            --gold: #fbbf24;
            --red: #ef4444;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        .header-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .btn-group-header {
            display: flex;
            gap: 10px;
        }

        .btn-acao {
            text-decoration: none;
            color: #94a3b8;
            background: var(--card);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.8rem;
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-acao:hover {
            color: var(--text);
            border-color: var(--secondary);
        }

        .btn-pdf {
            background: var(--red);
            color: white;
            border-color: var(--red);
        }

        /* --- CARDS DE RESUMO --- */
        .resumo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .card-resumo {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .card-resumo i {
            font-size: 1.8rem;
        }

        .resumo-info h4 {
            margin: 0;
            font-size: 0.8rem;
            color: var(--secondary);
            text-transform: uppercase;
        }

        .resumo-info p {
            margin: 5px 0 0 0;
            font-size: 1.4rem;
            font-weight: bold;
        }

        /* --- BARRA DE FILTROS --- */
        .filtros-box {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }

        .filtro-grupo {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .filtro-grupo label {
            font-size: 0.75rem;
            color: var(--secondary);
            font-weight: 600;
        }

        .filtro-grupo select,
        .filtro-grupo input {
            background: #0f172a;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 10px;
            border-radius: 8px;
            outline: none;
            font-size: 0.9rem;
        }

        /* --- TABELA --- */
        .tabela-container {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 15px;
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th,
        td {
            padding: 12px 15px;
            border-bottom: 1px solid var(--border);
            font-size: 0.9rem;
        }

        th {
            background: rgba(255, 255, 255, 0.02);
            color: var(--secondary);
        }

        .status-tag {
            font-size: 0.7rem;
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: bold;
        }

        .tag-pago {
            background: rgba(16, 185, 129, 0.1);
            color: var(--accent);
            border: 1px solid var(--accent);
        }

        .tag-pendente {
            background: rgba(251, 191, 36, 0.1);
            color: var(--gold);
            border: 1px solid var(--gold);
        }

        .pg-badge-group {
            display: inline-flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
        }

        .pg-badge {
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 6px;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .badge-pix {
            background: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }

        .badge-dinheiro {
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .badge-credito {
            background: rgba(163, 6, 6, 0.15);
            color: #c01d1d;
            border: 1px solid rgba(172, 8, 30, 0.295);
        }

        @media print {
            body {
                background: white;
                color: black;
                padding: 0;
            }

            .btn-group-header,
            .filtros-box {
                display: none !important;
            }

            .card-resumo,
            table,
            .tabela-container {
                background: white !important;
                border-color: #ccc !important;
                color: black !important;
            }

            th {
                background: #eee !important;
                color: black !important;
            }

            .pg-badge {
                border: 1px solid #000 !important;
                color: black !important;
                background: transparent !important;
            }
        }
    </style>
</head>

<body style="display: none;">

    <div class="container">
        <div class="header-box">
            <div>
                <h2 style="margin:0;">📊 Peladeiros Relatório</h2>
                <span style="background: #334155; padding: 4px 10px; border-radius: 20px; font-size: 0.7rem;">Gestão
                    2027</span>
            </div>
            <div class="btn-group-header">
                <button onclick="window.print()" class="btn-acao btn-pdf"><i class="fas fa-file-pdf"></i> Exportar
                    PDF</button>
                <a href="home.html" class="btn-acao"><i class="fas fa-home"></i> Menu Principal</a>
            </div>
        </div>

        <div class="resumo-grid">
            <div class="card-resumo">
                <i class="fas fa-wallet" style="color: var(--accent);"></i>
                <div class="resumo-info">
                    <h4>Total no Período</h4>
                    <p id="totalCaixa">R$ 0,00</p>
                </div>
            </div>
            <div class="card-resumo">
                <i class="fas fa-users" style="color: var(--blue);"></i>
                <div class="resumo-info">
                    <h4>Presenças</h4>
                    <p id="totalPresencas">0</p>
                </div>
            </div>
            <div class="card-resumo">
                <i class="fas fa-exclamation-triangle" style="color: var(--gold);"></i>
                <div class="resumo-info">
                    <h4>Pendentes</h4>
                    <p id="totalPendentes">0</p>
                </div>
            </div>
        </div>

        <div class="filtros-box">
            <div class="filtro-grupo">
                <label>Início</label>
                <input type="date" id="dataInicio" onchange="filtrarDados()">
            </div>
            <div class="filtro-grupo">
                <label>Fim</label>
                <input type="date" id="dataFim" onchange="filtrarDados()">
            </div>
            <div class="filtro-grupo">
                <label>Tipo</label>
                <select id="filtroTipo" onchange="filtrarDados()">
                    <option value="todos">Todos</option>
                    <option value="mensalista">Mensalistas</option>
                    <option value="avulso">Avulsos</option>
                </select>
            </div>
            <div class="filtro-grupo">
                <label>Situação</label>
                <select id="filtroPagamento" onchange="filtrarDados()">
                    <option value="todos">Todos</option>
                    <option value="pago">Pagos</option>
                    <option value="pendente">Pendentes</option>
                </select>
            </div>
        </div>

        <div class="tabela-container">
            <table>
                <thead>
                    <tr>
                        <th>Jogador</th>
                        <th>Tipo</th>
                        <th>Mensalidade</th>
                        <th>Pago no Dia</th>
                        <th>Forma Pagamento</th>
                        <th>Presença</th>
                        <th>Situação</th>
                    </tr>
                </thead>
                <tbody id="corpoTabela">
                    <tr>
                        <td colspan="7" style="text-align: center;">Carregando...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBji-wGGD2dl8STFS2tu23UKFaUrPC8Bww",
            authDomain: "db-peladeiros.firebaseapp.com",
            projectId: "db-peladeiros",
            storageBucket: "db-peladeiros.firebasestorage.app",
            messagingSenderId: "734317810376",
            appId: "1:734317810376:web:24573f2b49fdd232134bfd"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        let CONFIG = { valorMensal: 60, valorAvulso: 15 };
        let listaCompletaJogadores = [];

        auth.onAuthStateChanged(async (user) => {
            if (!user) {
                window.location.href = "login.html";
            } else {
                document.body.style.display = "block";
                init();
            }
        });

        async function init() {
            const hoje = new Date().toISOString().split('T')[0];
            document.getElementById('dataInicio').value = hoje;
            document.getElementById('dataFim').value = hoje;

            const doc = await db.collection("configuracoes").doc("parametros").get();
            if (doc.exists) CONFIG = doc.data();

            db.collection("jogadores_2026_beta").orderBy("nome", "asc").onSnapshot(snap => {
                listaCompletaJogadores = [];
                snap.forEach(doc => listaCompletaJogadores.push({ id: doc.id, ...doc.data() }));
                filtrarDados();
            });
        }

        function filtrarDados() {
            const inicio = document.getElementById('dataInicio').value;
            const fim = document.getElementById('dataFim').value;
            const buscaTipo = document.getElementById('filtroTipo').value;
            const buscaPagamento = document.getElementById('filtroPagamento').value;

            const tabela = document.getElementById('corpoTabela');
            tabela.innerHTML = "";

            let somaCaixa = 0, contaPresencas = 0, contaPendentes = 0;

            listaCompletaJogadores.forEach(j => {
                if (j.dataConfirmacao) {
                    const dataJ = j.dataConfirmacao.split('T')[0];
                    if (inicio && dataJ < inicio) return;
                    if (fim && dataJ > fim) return;
                } else if (inicio || fim) return;

                const isMensalista = String(j.tipo).toLowerCase() === 'mensalista';
                const isGoleiro = j.goleiro === true;
                const vMensal = parseFloat(j.valorMensalidadePago || 0);
                const vHoje = parseFloat(j.valorPagoHoje || 0);
                const totalGeralPago = vMensal > 0 ? vMensal : vHoje;
                const estaPago = isGoleiro || vMensal >= CONFIG.valorMensal || vHoje > 0;
                const confirmou = (j.presencaConfirmada === "S" || j.presencaConfirmada === true || j.presencaConfirmada === "true");

                if (buscaTipo !== 'todos' && String(j.tipo).toLowerCase() !== buscaTipo) return;
                if (buscaPagamento === 'pago' && !estaPago) return;
                if (buscaPagamento === 'pendente' && estaPago) return;

                // --- SISTEMA DE LEITURA DE VALORES REAIS ---
                let formaHTML = "-";
                if (isGoleiro) {
                    formaHTML = "<span class='pg-badge' style='border:1px solid var(--gold); color:var(--gold)'>ISENTO</span>";
                } else if (estaPago) {
                    let badges = [];

                    // Se o documento tiver os detalhes salvos do caixa, usa os valores reais digitados
                    if (j.detalhesPagamento) {
                        const d = j.detalhesPagamento;
                        if (parseFloat(d.pix || 0) > 0) {
                            badges.push(`<span class='pg-badge badge-pix'><i class='fa-brands fa-pix'></i> R$ ${parseFloat(d.pix).toFixed(2)} Pix</span>`);
                        }
                        if (parseFloat(d.dinheiro || 0) > 0) {
                            badges.push(`<span class='pg-badge badge-dinheiro'><i class='fas fa-money-bill-wave'></i> R$ ${parseFloat(d.dinheiro).toFixed(2)} Dinheiro</span>`);
                        }
                        if (parseFloat(d.cartao || 0) > 0) {
                            badges.push(`<span class='pg-badge badge-credito'><i class='fas fa-credit-card'></i> R$ ${parseFloat(d.cartao).toFixed(2)} Cartão</span>`);
                        }
                    } else {
                        // Modo de compatibilidade antiga (se não achar detalhes, divide igual)
                        const fStr = String(j.formaPagamento || "").toLowerCase();
                        let listFormas = [];
                        if (fStr.includes("+")) {
                            listFormas = fStr.split("+").map(item => item.trim());
                        } else if (fStr !== "") {
                            listFormas.push(fStr);
                        }
                        let valorPorBadge = listFormas.length > 0 ? totalGeralPago / listFormas.length : totalGeralPago;

                        listFormas.forEach(metodo => {
                            if (metodo.includes("pix")) badges.push(`<span class='pg-badge badge-pix'><i class='fa-brands fa-pix'></i> R$ ${valorPorBadge.toFixed(2)} Pix</span>`);
                            if (metodo.includes("dinheiro")) badges.push(`<span class='pg-badge badge-dinheiro'><i class='fas fa-money-bill-wave'></i> R$ ${valorPorBadge.toFixed(2)} Dinheiro</span>`);
                            if (metodo.includes("cartão") || metodo.includes("cartao") || metodo.includes("crédito")) badges.push(`<span class='pg-badge badge-credito'><i class='fas fa-credit-card'></i> R$ ${valorPorBadge.toFixed(2)} Cartão</span>`);
                        });
                    }

                    formaHTML = badges.length > 0 ? `<div class="pg-badge-group">${badges.join("")}</div>` : "<span class='pg-badge' style='background: #334155'>Confirmado</span>";
                }

                somaCaixa += vHoje;
                if (confirmou) contaPresencas++;
                if (!estaPago && !isGoleiro) contaPendentes++;

                tabela.innerHTML += `
                    <tr>
                        <td style="font-weight:600">${j.nome} ${isGoleiro ? '🧤' : ''}</td>
                        <td style="color:${isMensalista ? 'var(--blue)' : 'var(--secondary)'}">${j.tipo}</td>
                        <td>R$ ${vMensal.toFixed(2)}</td>
                        <td>R$ ${vHoje.toFixed(2)}</td>
                        <td>${formaHTML}</td>
                        <td style="color:${confirmou ? 'var(--accent)' : 'var(--red)'}; font-weight:bold">${confirmou ? 'SIM' : 'NÃO'}</td>
                        <td><span class="status-tag ${estaPago ? 'tag-pago' : 'tag-pendente'}">${estaPago ? 'PAGO' : 'PENDENTE'}</span></td>
                    </tr>
                `;
            });

            document.getElementById('totalCaixa').innerText = `R$ ${somaCaixa.toFixed(2)}`;
            document.getElementById('totalPresencas').innerText = contaPresencas;
            document.getElementById('totalPendentes').innerText = contaPendentes;

            if (tabela.innerHTML === "") {
                tabela.innerHTML = `<tr><td colspan="7" style="text-align:center; color:var(--secondary)">Nenhum registro encontrado.</td></tr>`;
            }
        }
    </script>
</body>

</html>
