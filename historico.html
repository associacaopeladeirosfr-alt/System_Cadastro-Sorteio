<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Histórico Peladeiros 2027</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --accent: #10b981;
            --text: #f8fafc;
            --border: #334155;
            --blue: #3b82f6;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        /* Header Padronizado */
        .header-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            background: var(--card);
            padding: 20px;
            border-radius: 20px;
            border: 1px solid var(--border);
        }

        .btn-home {
            text-decoration: none;
            color: #94a3b8;
            background: #0f172a;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-home:hover {
            background: #334155;
            color: white;
        }

        .badge {
            background: #334155;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            color: #cbd5e1;
        }

        /* Resumo do Dia */
        .info-bar {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
            background: rgba(59, 130, 246, 0.1);
            padding: 15px 25px;
            border-radius: 15px;
            border: 1px solid rgba(59, 130, 246, 0.2);
            color: var(--blue);
            font-weight: 500;
        }

        /* Grid de Times (Igual ao Sorteio) */
        .grid-times {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .time-card {
            background: #fff;
            color: #333;
            border-radius: 15px;
            padding: 20px;
            border-top: 8px solid #ccc;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .time-card h3 {
            margin: 0 0 15px 0;
            font-size: 1.1rem;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }

        /* Cores dos Times */
        .verde {
            border-top-color: #22c55e;
        }

        .amarelo {
            border-top-color: #eab308;
        }

        .vermelho {
            border-top-color: #ef4444;
        }

        .roxo {
            border-top-color: #a855f7;
        }

        .laranja {
            border-top-color: #f97316;
        }

        .lista-jogadores {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .lista-jogadores li {
            padding: 8px 0;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            justify-content: space-between;
            font-size: 0.95rem;
        }

        .lista-jogadores li:last-child {
            border-bottom: none;
        }

        .nivel-star {
            color: #fbbf24;
            font-weight: bold;
            font-size: 0.85rem;
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: #94a3b8;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="header-box">
            <div>
                <h2 style="margin:0;"><i class="fas fa-file-invoice"></i> Peladeiros Partidas</h2>
                <span class="badge">Gestão Peladeiros 2027</span>
                <p>
                    <span style="font-size: 0.8rem; color: #94a3b8; display: none;" id="dataPelada">Carregando
                        data...</span>
                </p>
            </div>
            <a href="index.html" class="btn-home">
                <i class="fas fa-home"></i> Menu Principal
            </a>
        </div>

        <div class="info-bar" id="resumoPelada">
            <span><i class="fas fa-users"></i> <span id="totalAtletas">0</span> Jogadores</span>
            <span><i class="fas fa-calendar-day"></i> <span id="dataFmt">--/--/----</span></span>
        </div>

        <div id="containerTimes" class="grid-times">
            <div class="loading">
                <i class="fas fa-spinner fa-spin fa-2x"></i>
                <p>Buscando escalação do dia...</p>
            </div>
        </div>
    </div>

    <script>
        // 1. Configurações corretas da Associação
        const firebaseConfig = {
            apiKey: "AIzaSyBji-wGGD2dl8STFS2tu23UKFaUrPC8Bww",
            authDomain: "db-peladeiros.firebaseapp.com",
            projectId: "db-peladeiros",
            storageBucket: "db-peladeiros.firebasestorage.app",
            messagingSenderId: "734317810376",
            appId: "1:734317810376:web:24573f2b49fdd232134bfd",
            measurementId: "G-8N28SLY3S6"
        };

        // 2. Inicialização única e correta do App
        firebase.initializeApp(firebaseConfig);

        // 3. Definição das constantes globais sem duplicidade
        const db = firebase.firestore();
        const auth = firebase.auth();

        // 4. Trava de segurança estruturada
        auth.onAuthStateChanged(async (user) => {
            if (!user) {
                window.location.href = "login.html";
            } else {
                const emailGoogle = user.email.toLowerCase().trim();
                const query = await db.collection("usuarios_permitidos").where("email", "==", emailGoogle).get();
                if (query.empty) {
                    await auth.signOut();
                    window.location.href = "login.html";
                }
            }
        });
        // Pega o ID do documento pela URL
        const urlParams = new URLSearchParams(window.location.search);
        const peladaId = urlParams.get('id');

        async function carregarDetalhes() {
            if (!peladaId) {
                document.getElementById('containerTimes').innerHTML = "<p>ID da partida não encontrado.</p>";
                return;
            }

            try {
                const doc = await db.collection("historico_sorteios").doc(peladaId).get();

                if (!doc.exists) {
                    document.getElementById('containerTimes').innerHTML = "<p>Pelada não encontrada no histórico.</p>";
                    return;
                }

                const dados = doc.data();
                const times = dados.times;

                // Formatar Data
                const dataObj = dados.data?.seconds ? new Date(dados.data.seconds * 1000) : new Date(dados.data);
                const dataString = dataObj.toLocaleDateString('pt-BR', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

                document.getElementById('dataPelada').innerText = dataString;
                document.getElementById('dataFmt').innerText = dataObj.toLocaleDateString('pt-BR');
                document.getElementById('totalAtletas').innerText = dados.totalJogadores || 0;

                renderizarTimes(times);

            } catch (error) {
                console.error("Erro:", error);
                document.getElementById('containerTimes').innerHTML = "<p>Erro ao carregar dados do Firebase.</p>";
            }
        }

        function renderizarTimes(times) {
            const container = document.getElementById('containerTimes');
            container.innerHTML = "";

            const cores = ['verde', 'amarelo', 'vermelho', 'roxo', 'laranja'];

            cores.forEach(cor => {
                if (times[cor] && times[cor].length > 0) {
                    let titulo = cor === 'laranja' ? 'RESERVAS / EXCEDENTES' : `TIME ${cor.toUpperCase()}`;

                    let html = `
                        <div class="time-card ${cor}">
                            <h3>${titulo}</h3>
                            <ul class="lista-jogadores">
                    `;

                    times[cor].forEach(j => {
                        html += `
                            <li>
                                <span>${j.goleiro ? '🧤' : '⚽'} ${j.nome}</span>
                                <span class="nivel-star">${j.nivel} <i class="fas fa-star"></i></span>
                            </li>
                        `;
                    });

                    html += `</ul></div>`;
                    container.innerHTML += html;
                }
            });
        }

        window.onload = carregarDetalhes;
    </script>
</body>

</html>
